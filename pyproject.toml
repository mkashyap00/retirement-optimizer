[project]
name = "retirement-optimizer"
version = "1.0.0"
description = "Tax-optimized retirement planner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    # The local-LLM client (OpenAI-compatible endpoints) talks HTTP with it.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    # Reads back the auto-saved PDF report in test_api_optimize.py.
    "pypdf>=4.0",
]
# Optional feature: LLM-enhanced report narrative.
# Install with: pip install -e ".[llm]"
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
pythonpath = ["backend"]  # makes backend/benchmarks importable from the tests
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in default args is idiomatic and safe
